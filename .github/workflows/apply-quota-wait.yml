name: Apply quota wait patch

on:
  push:
    branches:
      - feature/single-model-quota-wait
    paths:
      - .github/quota-wait.patch
      - .github/workflows/apply-quota-wait.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/single-model-quota-wait
          fetch-depth: 0

      - name: Apply patch
        run: |
          git apply --check .github/quota-wait.patch
          git apply .github/quota-wait.patch
          rm .github/quota-wait.patch
          rm .github/workflows/apply-quota-wait.yml

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add single-model quota wait mode"
          git push origin HEAD:feature/single-model-quota-wait
