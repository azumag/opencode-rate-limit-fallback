name: Apply quota wait patch

on:
  push:
    branches:
      - feature/single-model-quota-wait
    paths:
      - .github/quota-wait.patch
      - .github/workflows/apply-quota-wait.yml

permissions:
  contents: write

jobs:
  apply-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/single-model-quota-wait
          fetch-depth: 0

      - name: Apply patch
        run: |
          git apply --check --exclude=README.md .github/quota-wait.patch
          git apply --exclude=README.md .github/quota-wait.patch
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          text = text.replace(
              '- Three fallback modes: `cycle`, `stop`, and `retry-last`\n- **Headless mode support** (`opencode run`): disable fallback or abort on rate limit',
              '- Four fallback modes: `cycle`, `stop`, `retry-last`, and single-model `wait`\n- **Headless mode support** (`opencode run`): disable fallback, abort, or use single-model quota wait',
          )
          text = text.replace(
              'When running in headless mode (no TUI), model fallback is disabled by default because headless sessions should use their configured model only.\n\nYou can control what happens when a rate limit is detected in headless mode using the `headlessOnRateLimit` option:',
              'When running in headless mode (no TUI), model fallback is disabled by default because headless sessions should use their configured model only.\n\n`fallbackMode: "wait"` is the exception: it keeps the same model and runs the\nquota-wait loop in headless mode unless `headlessOnRateLimit` is `"abort"`.\n\nYou can control what happens when a rate limit is detected in headless mode using the `headlessOnRateLimit` option:',
          )
          text = text.replace(
              '| `"retry-last"` | Try the last model once more, then reset to first on next prompt |\n\n### Retry Policy',
              '| `"retry-last"` | Try the last model once more, then reset to first on next prompt |\n| `"wait"` | Keep the current model, wait `cooldownMs`, and retry it indefinitely on rate limits |\n\n### Retry Policy',
          )
          path.write_text(text)
          PY
          rm .github/quota-wait.patch
          rm .github/workflows/apply-quota-wait.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add single-model quota wait mode"
          git push origin HEAD:feature/single-model-quota-wait
