name: Prepare Vitest security-patch objects

on:
  push:
    branches: [codex/publication-review-20260914]
    paths: [.github/workflows/publication-lockfile-blob.yml]

permissions: {}

jobs:
  prepare:
    if: github.repository == 'azumag/opencode-rate-limit-fallback' && github.ref == 'refs/heads/codex/publication-review-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: aaad1fa88f102dffb40846c5024bb07a7a7ee85b
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve only the fixed Vitest patch without running package scripts
        run: |
          cp package.json "$RUNNER_TEMP/original-package.json"
          cp package-lock.json "$RUNNER_TEMP/original-lock.json"
          npm install --package-lock-only --ignore-scripts --save-exact --save-dev vitest@4.1.11 @vitest/coverage-v8@4.1.11
          npm audit --json > "$RUNNER_TEMP/fixed-audit.json"
      - name: Verify change boundaries and create blobs only; no commits or refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import copy, json, os, pathlib, urllib.request
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          original = json.loads((temp / 'original-package.json').read_text())
          current = json.loads(pathlib.Path('package.json').read_text())
          expected = copy.deepcopy(original)
          for name in ('vitest', '@vitest/coverage-v8'):
              assert original['devDependencies'][name] == '^4.1.10'
              expected['devDependencies'][name] = '4.1.11'
          # npm omits an empty dependency map; restore it, not other metadata.
          if 'dependencies' not in current and original.get('dependencies') == {}:
              current['dependencies'] = {}
          assert current == expected, 'Unexpected changed package fields: ' + ', '.join(k for k in set(current) | set(expected) if current.get(k) != expected.get(k))
          pathlib.Path('package.json').write_text(json.dumps(expected, indent=2) + '\n')
          old_lock = json.loads((temp / 'original-lock.json').read_text())
          new_lock = json.loads(pathlib.Path('package-lock.json').read_text())
          assert {k: v for k, v in old_lock.items() if k != 'packages'} == {k: v for k, v in new_lock.items() if k != 'packages'}
          before = old_lock['packages']
          after = new_lock['packages']
          changed = [p for p in sorted(set(before) | set(after)) if before.get(p) != after.get(p)]
          print('Changed lockfile entries: ' + json.dumps(changed))
          assert all(p == '' or p == 'node_modules/vitest' or p.startswith('node_modules/@vitest/') for p in changed), 'Unrelated dependency updates are forbidden'
          for name in ('vitest', '@vitest/coverage-v8', '@vitest/mocker'):
              assert after['node_modules/' + name]['version'] == '4.1.11'
          audit = json.loads((temp / 'fixed-audit.json').read_text())
          assert audit['metadata']['vulnerabilities']['total'] == 0 and 'error' not in audit
          print('Full npm audit: zero vulnerabilities')
          root = 'https://api.github.com/repos/azumag/opencode-rate-limit-fallback/git/blobs'
          for name in ('package.json', 'package-lock.json'):
              payload = json.dumps({'content': pathlib.Path(name).read_text(), 'encoding': 'utf-8'}).encode()
              request = urllib.request.Request(root, data=payload, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'publication-patch-review'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              print(name + ' verified blob: ' + result['sha'])
          PY
