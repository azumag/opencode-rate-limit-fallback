name: Prepare publication lockfile object

on:
  push:
    branches: [codex/publication-review-20260914]
    paths: [.github/workflows/publication-lockfile-blob.yml]

permissions: {}

jobs:
  prepare:
    if: github.repository == 'azumag/opencode-rate-limit-fallback' && github.ref == 'refs/heads/codex/publication-review-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Create only the verified lockfile blob; never commit, push, or publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          root = 'https://api.github.com/repos/azumag/opencode-rate-limit-fallback'
          def request(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(root + path, data=data, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'publication-lockfile-review', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          original = request('/contents/package-lock.json?ref=74b6b9dbcfc56fc963a78d0fa025e781ca410dd7')
          assert original['sha'] == '8452e7fd09ee3c7c23ff3df54057a4263a646d99'
          raw = base64.b64decode(original['content']).decode()
          parsed = json.loads(raw)
          assert parsed['version'] == '2.0.2' and parsed['packages']['']['version'] == '2.0.2'
          updated = raw.replace('"version": "2.0.2"', '"version": "2.0.3"', 2)
          check = json.loads(updated)
          check['version'] = '2.0.2'
          check['packages']['']['version'] = '2.0.2'
          assert check == parsed, 'Dependency data must remain unchanged'
          data = updated.encode()
          expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert expected == '6cb753034a539dfeebbd4536ac6432dfd90d9ca6'
          created = request('/git/blobs', {'content': updated, 'encoding': 'utf-8'})
          assert created['sha'] == expected
          print('Verified version-only lockfile blob: ' + created['sha'])
          PY
